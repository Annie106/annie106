<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>视频播放</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect width='24' height='24' rx='6' fill='%234f8cff'/><path d='M9 6.5v11l9-5.5z' fill='white'/></svg>">
<style>
:root{
  --bg:#ffffff; --panel:#ffffff; --line:#eaeaea;
  --txt:#1a1a1a; --dim:#777777; --acc:#1a1a1a; --danger:#d14b4b;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
  height:100%;margin:0;background:var(--bg);color:var(--txt);overflow:hidden;
  font:14px/1.65 system-ui,-apple-system,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
}
button{
  font:inherit;color:var(--txt);cursor:pointer;
  border:1px solid var(--line);
  border-radius:9px;padding:7px 13px;
  background:#fff;
  box-shadow:0 1px 2px rgba(0,0,0,.03);
  transition:.18s;
}
button:hover{
  background:#f7f7f7;
  border-color:#d8d8d8;
}
button:active{transform:scale(.97)}
button.primary{
  background:#111;
  border-color:#111;
  color:#fff;
  box-shadow:0 2px 8px rgba(0,0,0,.12);
}
button.primary:hover{
  background:#333;
  border-color:#333;
}

/* ===== button-wrap 结构（无边框、无蓝色柔光） ===== */
.button-wrap{
  position:relative;
  display:inline-block;
}
.button-wrap button{
  position:relative;
  z-index:2;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  padding:10px 22px;
  border:none;
  border-radius:8px;
  font-size:13px;
  font-weight:600;
  letter-spacing:.8px;
  color:#fff;
  background:#2a2a32;
  cursor:pointer;
  transition:transform .15s ease, background .15s ease;
  box-shadow:none;
}
.button-wrap button svg{
  width:16px;height:16px;display:block;pointer-events:none;fill:currentColor;
}
.button-wrap .button-shadow{
  position:absolute;
  z-index:1;
  inset:0;
  border-radius:8px;
  background:#2a2a32;
  filter:blur(8px);
  opacity:.6;
  transform:translateY(4px);
  transition:transform .15s ease, opacity .15s ease;
  pointer-events:none;
}
.button-wrap:hover button{
  background:#33333d;
  transform:translateY(-2px);
}
.button-wrap:hover .button-shadow{
  transform:translateY(7px);
  opacity:.85;
}
.button-wrap:active button{
  transform:translateY(1px);
  background:#232329;
}
.button-wrap:active .button-shadow{
  transform:translateY(2px);
  opacity:.5;
}

#stage{position:fixed;inset:0;background:#000;overflow:hidden}
#player{width:100%;height:100%;object-fit:contain;background:#000;display:block;outline:none}

/* 左上角水印 */
#watermark{
  position:absolute;top:25px;left:35px;z-index:12;
  pointer-events:none;user-select:none;
  font-size:25px;font-weight:800;letter-spacing:2.4px;
  color:rgba(255,255,255,.65);
  text-shadow:0 1px 8px rgba(0,0,0,.55);
  filter:drop-shadow(0 1px 3px rgba(0,0,0,.5));
}



/* 中央加载动画 */
#loadingBox{
  position:absolute;left:50%;top:50%;
  transform:translate(-50%,-50%);
  z-index:19;pointer-events:none;user-select:none;
  display:flex;flex-direction:column;align-items:center;gap:14px;
  opacity:0;transition:opacity .2s;
}
#loadingBox.show{opacity:1}
.spinner{
  width:46px;height:46px;
  border:3px solid rgba(255,255,255,.2);
  border-top-color:#fff;
  border-right-color:rgba(255,255,255,.65);
  border-radius:50%;
  animation:spin .9s linear infinite;
  box-shadow:0 0 24px rgba(255,255,255,.12);
}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{
  font-size:12.5px;
  color:rgba(255,255,255,.7);
  text-shadow:0 1px 4px rgba(0,0,0,.85);
  letter-spacing:.6px;
}

#playIcon{
  position:absolute;left:50%;top:50%;
  transform:translate(-50%,-50%) scale(.72);
  z-index:18;pointer-events:none;user-select:none;
  width:92px;height:92px;display:grid;place-items:center;
  border-radius:50%;
  color:#fff;
  background:linear-gradient(135deg,rgba(255,255,255,.22),rgba(255,255,255,.06));
  border:1px solid rgba(255,255,255,.22);
  box-shadow:0 8px 32px rgba(0,0,0,.5);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  opacity:0;transition:opacity .22s,transform .22s;
}
#playIcon.persist{opacity:.92;transform:translate(-50%,-50%) scale(1)}

/* 中央播放 / 暂停图标（checkbox 切换组件） */
#playIcon .container{
  position:relative;
  width:40px;height:40px;
  display:grid;place-items:center;
}
#playIcon .container input{display:none}
#playIcon .container svg{
  position:absolute;
  height:38px;
  width:auto;
  display:block;
  fill:currentColor;
  transition:opacity .2s ease, transform .2s ease;
}
#playIcon .container .play{opacity:1;transform:scale(1)}
#playIcon .container .pause{opacity:0;transform:scale(.6)}
#playIcon.show-pause .container .play{opacity:0;transform:scale(.6)}
#playIcon.show-pause .container .pause{opacity:1;transform:scale(1)}

#bar{
  position:absolute;left:0;right:0;bottom:0;z-index:15;
  display:flex;flex-direction:column;gap:8px;
  padding:12px 14px calc(12px + env(safe-area-inset-bottom));
  background:linear-gradient(to top,rgba(0,0,0,.9),rgba(0,0,0,.5) 60%,transparent);
  opacity:0;pointer-events:none;transition:opacity .25s;
}
#bar.show{opacity:1;pointer-events:auto}

body.mobile-mode .icon-btn{width:44px;height:44px}
body.mobile-mode .icon-btn svg{width:20px;height:20px}
body.mobile-mode .icon-btn.big svg{width:24px;height:24px}
body.mobile-mode #btnSpeed{width:50px;height:44px;font-size:14px}

#progressRow{display:flex;align-items:center;gap:10px;padding:0 2px}
#timeCurrent,#timeTotal{
  font-size:12px;color:#c3c3ce;
  font-variant-numeric:tabular-nums;
  text-shadow:0 1px 4px rgba(0,0,0,.9);
  flex:none;min-width:44px;
}
#timeCurrent{text-align:right}
#timeTotal{text-align:left}

#progressBar{flex:1;height:16px;position:relative;cursor:pointer;touch-action:none}
#progressBar::before{
  content:"";position:absolute;left:0;right:0;top:50%;
  transform:translateY(-50%);
  height:4px;border-radius:2px;
  background:rgba(255,255,255,.18);
  transition:height .15s;
}
#progressBuffer{
  position:absolute;left:0;top:50%;
  transform:translateY(-50%);
  height:4px;border-radius:2px;width:0;
  background:rgba(255,255,255,.3);
  transition:height .15s;
}
#progressPlayed{
  position:absolute;left:0;top:50%;
  transform:translateY(-50%);
  height:4px;border-radius:2px;width:0;
  background:linear-gradient(90deg,#fff,#d8d8d8);
  box-shadow:0 0 8px rgba(255,255,255,.25);
  transition:height .15s;
}
#progressThumb{
  position:absolute;left:0;top:50%;
  width:13px;height:13px;border-radius:50%;
  background:linear-gradient(135deg,#ffffff,#d8d8d8);
  transform:translate(-50%,-50%) scale(.6);
  box-shadow:0 2px 8px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.55);
  opacity:0;
  transition:opacity .15s,transform .15s;
  pointer-events:none;
}
#progressBar:hover::before,
#progressBar:hover #progressBuffer,
#progressBar:hover #progressPlayed,
#progressBar.dragging::before,
#progressBar.dragging #progressBuffer,
#progressBar.dragging #progressPlayed{height:6px}
#progressBar:hover #progressThumb,
#progressBar.dragging #progressThumb{opacity:1;transform:translate(-50%,-50%) scale(1)}
#progressBar.dragging #progressThumb{transform:translate(-50%,-50%) scale(1.2)}

#controlsRow{display:flex;align-items:center;gap:8px}

.icon-btn{
  width:38px;height:38px;flex:none;display:grid;place-items:center;padding:0;
  color:#fff;line-height:1;
  border:1px solid rgba(255,255,255,.20);
  border-radius:10px;
  background:linear-gradient(135deg,
              rgba(255,255,255,.24) 0%,
              rgba(255,255,255,.10) 45%,
              rgba(255,255,255,.04) 100%);
  box-shadow:0 1px 0 rgba(255,255,255,.22) inset,0 3px 12px rgba(0,0,0,.4);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  transition:.18s;
}
.icon-btn:hover{
  background:linear-gradient(135deg,
              rgba(255,255,255,.38) 0%,
              rgba(255,255,255,.18) 45%,
              rgba(255,255,255,.08) 100%);
  border-color:rgba(255,255,255,.34);
}
.icon-btn:active{transform:scale(.95)}
.icon-btn svg{width:18px;height:18px;display:block;pointer-events:none}
.icon-btn.big svg{width:20px;height:20px}

#btnSpeed{
  width:44px;height:38px;flex:none;
  display:grid;place-items:center;padding:0;
  font-size:13px;font-weight:700;color:#fff;letter-spacing:.3px;
  border:1px solid rgba(255,255,255,.20);
  border-radius:10px;
  background:linear-gradient(135deg,
              rgba(255,255,255,.24) 0%,
              rgba(255,255,255,.10) 45%,
              rgba(255,255,255,.04) 100%);
  box-shadow:0 1px 0 rgba(255,255,255,.22) inset,0 3px 12px rgba(0,0,0,.4);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  transition:.18s;
}
#btnSpeed:hover{
  background:linear-gradient(135deg,
              rgba(255,255,255,.38) 0%,
              rgba(255,255,255,.18) 45%,
              rgba(255,255,255,.08) 100%);
  border-color:rgba(255,255,255,.34);
}
#btnSpeed.active{
  background:linear-gradient(135deg,#555,#222);
  border-color:rgba(255,255,255,.28);
  box-shadow:0 1px 0 rgba(255,255,255,.2) inset,0 3px 12px rgba(0,0,0,.35);
}

#nowTitle{
  flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  font-size:13.5px;color:#e9e9f0;text-shadow:0 1px 4px rgba(0,0,0,.85);
  padding:0 4px;
}

#volBox{position:relative;flex:none}
#volSlider{
  position:absolute;bottom:calc(100% + 12px);right:-6px;
  padding:13px 14px;
  border-radius:12px;
  border:1px solid rgba(255,255,255,.15);
  background:linear-gradient(135deg,rgba(48,48,58,.97),rgba(26,26,32,.97));
  box-shadow:0 10px 30px rgba(0,0,0,.6);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  opacity:0;pointer-events:none;
  transform:translateY(6px);
  transition:opacity .2s,transform .2s;
}
#volSlider::before{
  content:"";position:absolute;left:0;right:0;bottom:-14px;height:14px;
}
#volBox:hover #volSlider,
#volBox.open #volSlider{
  opacity:1;pointer-events:auto;transform:translateY(0);
}
#volRange{
  -webkit-appearance:none;appearance:none;
  display:block;width:112px;height:4px;margin:0;
  border-radius:2px;outline:none;cursor:pointer;
  background:linear-gradient(90deg,
              #fff 0%,
              #ddd var(--v,100%),
              rgba(255,255,255,.18) var(--v,100%),
              rgba(255,255,255,.18) 100%);
}
#volRange::-webkit-slider-thumb{
  -webkit-appearance:none;appearance:none;
  width:14px;height:14px;border-radius:50%;border:none;
  background:linear-gradient(135deg,#ffffff,#d8d8d8);
  box-shadow:0 2px 8px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.5);
  cursor:pointer;transition:transform .15s;
}
#volRange::-webkit-slider-thumb:hover{transform:scale(1.18)}
#volRange::-moz-range-track{
  height:4px;border-radius:2px;background:rgba(255,255,255,.18);
}
#volRange::-moz-range-progress{
  height:4px;border-radius:2px;
  background:linear-gradient(90deg,#fff,#d8d8d8);
}
#volRange::-moz-range-thumb{
  width:14px;height:14px;border-radius:50%;border:none;
  background:linear-gradient(135deg,#ffffff,#d8d8d8);
  box-shadow:0 2px 8px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.5);
  cursor:pointer;
}

#speedBox{position:relative;flex:none}
#speedMenu{
  position:absolute;bottom:calc(100% + 12px);left:50%;
  transform:translateX(-50%) translateY(6px);
  padding:6px;
  border-radius:12px;
  border:1px solid rgba(255,255,255,.15);
  background:linear-gradient(135deg,rgba(48,48,58,.97),rgba(26,26,32,.97));
  box-shadow:0 10px 30px rgba(0,0,0,.6);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  opacity:0;pointer-events:none;
  transition:opacity .2s,transform .2s;
  display:flex;flex-direction:column;gap:2px;
  min-width:92px;
}
#speedMenu::before{
  content:"";position:absolute;left:0;right:0;bottom:-14px;height:14px;
}
#speedBox.open #speedMenu{
  opacity:1;pointer-events:auto;
  transform:translateX(-50%) translateY(0);
}
#speedMenu button{
  width:100%;text-align:center;padding:7px 10px;
  border:none;border-radius:7px;
  background:transparent;
  font-size:13px;color:#cfcfd8;
  box-shadow:none;
  letter-spacing:.4px;
}
#speedMenu button:hover{
  background:rgba(255,255,255,.09);color:#fff;
}
#speedMenu button.active{
  background:rgba(255,255,255,.16);
  color:#fff;font-weight:700;
}

#scrim{
  position:absolute;inset:0;z-index:25;background:rgba(0,0,0,.5);
  opacity:0;pointer-events:none;transition:opacity .25s;
}
#scrim.show{opacity:1;pointer-events:auto}

#panel{
  position:absolute;top:0;right:0;bottom:0;z-index:30;
  width:min(360px,88vw);
  background:#fff;
  border-left:1px solid var(--line);
  display:flex;flex-direction:column;
  transform:translateX(101%);transition:transform .28s cubic-bezier(.4,0,.2,1);
  padding-top:env(safe-area-inset-top);
  padding-bottom:env(safe-area-inset-bottom);
  box-shadow:-12px 0 36px rgba(0,0,0,.12);
}
#panel.open{transform:none}
.p-head{
  display:flex;align-items:center;gap:10px;flex:none;
  padding:16px;border-bottom:1px solid var(--line);font-weight:600;
  background:#fff;
}
.p-heading{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.p-kicker{color:#999;font-size:10px;font-weight:500;letter-spacing:.09em}
.p-heading strong{font-size:15px;font-weight:650}
.music-control-btn{
  flex:none;padding:6px 9px;font-size:12px;white-space:nowrap;
  border-radius:7px;color:#333;background:#fff;box-shadow:none;
}
#panel .icon-btn{
  color:#555;border:1px solid #eaeaea;background:#fff;box-shadow:none;
}
#panel .icon-btn:hover,.music-control-btn:hover{background:#f5f5f5;border-color:#ddd}
.music-control-btn:disabled{cursor:default;opacity:.65}
#list{list-style:none;margin:0;padding:10px 0;overflow-y:auto;flex:1}
#list .empty{padding:26px 16px;text-align:center;color:var(--dim);font-size:13px}
.item{
  display:flex;align-items:center;gap:10px;padding:11px 16px;cursor:pointer;
  border-left:3px solid transparent;transition:background .15s;
}
.item:hover{background:#f7f7f7}
.item.active{
  background:#f5f5f5;
  border-left-color:var(--acc);
}
.item .idx{width:18px;flex:none;text-align:center;color:var(--dim);font-size:12px}
.item.active .idx{color:#1a1a1a;font-weight:700}
.item .meta{flex:1;min-width:0}
.item .nm{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* 联系我们 */
.p-foot{
  flex:none;
  padding:14px 16px calc(14px + env(safe-area-inset-bottom));
  border-top:1px solid var(--line);
  background:#fff;
}
.contact-btn{
  display:block;
  width:100%;
  padding:10px 12px;
  font-size:14px;
  font-weight:500;
  text-align:center;
  border-radius:9px;
  background:#111;
  border:1px solid #111;
  color:#fff;
  cursor:pointer;
  letter-spacing:.5px;
  transition:.18s;
}
.contact-btn:hover{
  background:#333;
  border-color:#333;
  color:#fff;
}
.contact-btn:active{transform:scale(.98)}

#overlay{
  --line:#383838;
  --dim:#b8b8b8;
  position:absolute;inset:0;z-index:20;
  display:flex;align-items:flex-start;justify-content:center;
  padding:24px;overflow:auto;
  background:radial-gradient(circle at 50% 20%,#282828 0%,#111 72%);
  color:#f2f2f2;
}
#overlay[hidden]{display:none}
.ov-card{
  width:min(640px,100%);
  margin:auto 0;
  animation:pop .22s ease;
}
@keyframes pop{from{opacity:0;transform:translateY(10px)}}
.ov-ico{font-size:30px;line-height:1;margin-bottom:10px}
.ov-card h2{margin:0 0 9px;font-size:18px;font-weight:650}
.ov-reason{margin:0 0 16px;color:#b9b9c4;font-size:13.5px;line-height:1.65}

.ov-scenarios{
  border-top:1px solid var(--line);
  padding-top:14px;
}
.ov-sec-title{
  font-size:12px;font-weight:600;
  color:var(--dim);letter-spacing:.6px;
  margin:0 0 10px;
}
.ov-scenario{
  border:1px solid var(--line);
  border-radius:10px;
  margin-bottom:8px;
  overflow:hidden;
  background:#171717;
  transition:border-color .15s;
}
.ov-scenario:hover{border-color:#35353f}
.ov-scenario[open]{background:#202020;border-color:#444}
.ov-scenario summary{
  display:flex;align-items:center;gap:9px;
  padding:11px 13px;
  cursor:pointer;
  font-size:13.5px;
  list-style:none;
  user-select:none;
  transition:background .15s;
}
.ov-scenario summary:hover{background:rgba(255,255,255,.03)}
.ov-scenario summary::-webkit-details-marker{display:none}
.ov-scenario summary::after{
  content:"▸";
  margin-left:auto;
  color:var(--dim);
  font-size:11px;
  transition:transform .2s;
}
.ov-scenario[open] summary::after{transform:rotate(90deg)}
.sc-icon{font-size:15px;line-height:1}
.sc-title{flex:1;font-weight:500}
.sc-badge{
  font-size:10px;
  padding:1px 7px;
  border-radius:20px;
  background:rgba(255,255,255,.1);
  color:#e5e5e5;
  border:1px solid rgba(255,255,255,.18);
  font-weight:600;
  letter-spacing:.3px;
  margin-right:4px;
}
.sc-badge.warn{
  background:linear-gradient(135deg,rgba(255,107,107,.35),rgba(255,107,107,.15));
  color:#ffc0c0;
  border-color:rgba(255,107,107,.4);
}
.sc-body{
  padding:2px 14px 14px 36px;
  color:#b9b9c4;
  font-size:13px;
}
.sc-body p{margin:0 0 10px}
.sc-body ol{margin:0;padding-left:18px}
.sc-body ol li{margin-bottom:8px;line-height:1.65}
.sc-body ol li::marker{color:#bdbdbd}
.sc-quote{
  display:block;
  margin:6px 0 4px;
  padding:9px 12px;
  border-left:3px solid #aaa;
  background:rgba(255,255,255,.06);
  border-radius:0 8px 8px 0;
  color:#eee;
  font-size:13px;
  line-height:1.6;
  user-select:text;
  -webkit-user-select:text;
}

.ov-detail{
  margin-top:14px;padding:8px 10px;border-radius:8px;
  background:#0d0d11;border:1px solid var(--line);
  font:12px/1.6 ui-monospace,Menlo,Consolas,monospace;
  color:#b8b8b8;
  word-break:break-all;
  white-space:pre-wrap;
}
.ov-btns{display:flex;flex-wrap:wrap;gap:14px;margin-top:18px;align-items:center}

#imgLoadingOverlay{
  position:fixed;inset:0;z-index:9999;
  background:#000;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
}
#imgLoadingOverlay[hidden]{display:none}
#imgLoadingOverlay img{
  max-width:100%;max-height:100%;
  object-fit:contain;
  display:block;
}
#imgLoadingOverlay .hint{
  position:absolute;bottom:24px;left:0;right:0;
  text-align:center;color:#8b8b96;font-size:13px;
  pointer-events:none;
}

#toast{
  position:fixed;left:50%;bottom:110px;z-index:100;
  transform:translate(-50%,10px);
  background:linear-gradient(135deg,rgba(48,48,58,.97),rgba(26,26,32,.97));
  border:1px solid rgba(255,255,255,.14);
  color:#fff;font-size:13px;padding:8px 16px;border-radius:20px;
  opacity:0;pointer-events:none;transition:.22s;
  box-shadow:0 6px 22px rgba(0,0,0,.5);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* ==================== 深色模式 ==================== */
[data-theme="dark"]{
  --bg:#0f1115; --panel:#16191f; --line:#2a2e37;
  --txt:#e7e9ee; --dim:#9aa1ad; --acc:#ffffff; --danger:#ff8f88;
}
[data-theme="dark"] body{background:var(--bg);color:var(--txt)}
[data-theme="dark"] button{

<script>
(function () {
  function apply() {
    var t = null;
    try { t = localStorage.getItem('annie-theme'); } catch (e) {}
    var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    var theme = (t === 'light' || t === 'dark') ? t : (dark ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', theme);
  }
  apply();
  // 跟随博客主页的主题切换（iframe 与父页同源，共享 localStorage）
  window.addEventListener('storage', function (e) {
    if (e.key === 'annie-theme') apply();
  });
})();
</script>

  function clearVideoTrackCheck() {

  function scheduleVideoTrackCheck() {
    clearVideoTrackCheck();
    if (noVideoTrackShown) return;

    videoTrackTimer = setTimeout(() => {
      videoTrackTimer = 0;
      const playing = !video.paused && !video.ended;
      const playedSome = video.currentTime > 0.5;
      const hasData = video.readyState >= 2;
      const noVideo = video.videoWidth === 0 || video.videoHeight === 0;

      if (playing && playedSome && hasData && noVideo) {

        signal: ctrl.signal,
        cache: 'no-store',
        mode: 'cors'
      });
      clearTimeout(timer);
      if (!res.ok) return '';
      const data = await res.json();
      return String(data.region || data.city || data.region_code || data.country || '');
    } catch (e) {
      return '';
    }
  }

  const REGION_RE = /福建|重庆|Fujian|Chongqing/i;

  /* =========================================================
     ⑩ 全屏图片加载过渡 + 判断
     ========================================================= */
  function showImageThenDecide(videoUrl, code, wasTimeout) {
    imgLoadingOverlay.hidden = false;
    imgLoadingEl.removeAttribute('src');

    const bust = (PROBE_IMAGE_URL.indexOf('?') > -1 ? '&' : '?') +
                 '_t=' + Date.now() +
                 '_r=' + Math.random().toString(36).slice(2);
    imgLoadingEl.src = PROBE_IMAGE_URL + bust;

    let settled = false;

    const finish = (imageOk) => {
      if (settled) return;
      settled = true;

      imgLoadingEl.onload = null;
      imgLoadingEl.onerror = null;
      try { imgLoadingEl.removeAttribute('src'); } catch (e) {}
      imgLoadingOverlay.hidden = true;

      if (imageOk) {
        renderErrorUI('disabled', code, wasTimeout, videoUrl, null);
      } else {
        detectRegion().then(function (region) {
          if (REGION_RE.test(region)) {
            renderErrorUI('region', code, wasTimeout, videoUrl, null);
          } else {
            renderErrorUI('captcha', code, wasTimeout, videoUrl, null);
          }
        });
      }
    };

    imgLoadingEl.onload = () => finish(true);
    imgLoadingEl.onerror = () => finish(false);

    setTimeout(() => {
      if (!settled) finish(false);
    }, 12000);
  }

  /* =========================================================
     ⑪ 普通错误面板
     ========================================================= */
  function renderErrorUI(priority, code, wasTimeout, url, probe) {
    hideLoading();
    const sc = SCENARIOS[priority];

    overlay.hidden = false;
    ovIcon.textContent = sc.icon;
    ovTitle.textContent = sc.title;
    ovReason.textContent = sc.desc;

    ovScenarios.innerHTML = '';
    const h = el('h3', 'ov-sec-title', '可能的原因与解决办法');
    ovScenarios.appendChild(h);

    const order = ['disabled', 'captcha', 'region', 'nodecode', 'aborted'];
    order.splice(order.indexOf(priority), 1);
    order.unshift(priority);

    order.forEach(key => {
      const s = SCENARIOS[key];
      if (!s) return;
      const details = el('details', 'ov-scenario');
      if (key === priority) details.open = true;

      const summary = el('summary');
      summary.appendChild(el('span', 'sc-icon', s.icon));
      summary.appendChild(el('span', 'sc-title', s.title));
      if (key === priority) {
        const badge = el('span', 'sc-badge' + (priority === 'nodecode' ? ' warn' : ''), '参考');
        summary.appendChild(badge);
      }
      details.appendChild(summary);

      const body = el('div', 'sc-body');
      body.appendChild(el('p', null, s.desc));

      if (s.steps && s.steps.length) {
        const ol = el('ol');
        s.steps.forEach(step => {
          const li = el('li');
          li.innerHTML = step;
          ol.appendChild(li);
        });
        body.appendChild(ol);
      }

      details.appendChild(body);
      ovScenarios.appendChild(details);
    });

    ovBtns.innerHTML = '';

    if (priority === 'captcha') {
      ovBtns.appendChild(mkBtn('打开直链完成验证', 'primary', () => {
        if (url) window.open(url, '_blank', 'noopener');
      }));
      ovBtns.appendChild(mkRefreshBtn('重新加载', () => {
        if (index >= 0) loadOnly(index);
      }));
    } else {
      ovBtns.appendChild(mkRefreshBtn('重新加载', () => {
        if (index >= 0) loadOnly(index);
      }));
      if (playlist.length > 1) {
        /* 换一个视频：打开视频列表面板 */
        ovBtns.appendChild(mkListBtn('换一个视频', () => {
          setPanel(true);
        }));
      }
    }

    const parts = [];
    if (code) {
      const names = { 1: 'ABORTED', 2: 'NETWORK', 3: 'DECODE', 4: 'SRC_NOT_SUPPORTED' };
      parts.push('MediaError ' + code + (names[code] ? ' (' + names[code] + ')' : ''));
    }
    if (priority === 'nodecode') {
      parts.push('画面未能显示，建议换浏览器或换 MP4 格式的视频');
    }
    if (video.networkState != null) {
      const ns = { 0: 'NETWORK_EMPTY', 1: 'NETWORK_IDLE', 2: 'NETWORK_LOADING', 3: 'NETWORK_NO_SOURCE' };
      parts.push('network=' + (ns[video.networkState] || video.networkState));
    }
    if (wasTimeout) parts.push('超时(60s)');

    if (parts.length) {
      ovDetail.textContent = parts.join('  ·  ');
      ovDetail.hidden = false;
    } else {
      ovDetail.hidden = true;
    }
  }

  /* =========================================================
     ⑫ 错误入口
     ========================================================= */
  function showVideoError(priorityOverride) {
    clearTimeout(watchdog);
    clearVideoTrackCheck();
    hidePlayIcon();
    if (!(video.currentSrc || video.src)) return;

    const url  = lastUrl || video.currentSrc || video.src || '';
    const err  = video.error;
    const code = err ? err.code : 0;
    const wasTimeout = timedOut;
    timedOut = false;

    overlay.hidden = true;
    imgLoadingOverlay.hidden = true;

    if (priorityOverride) {
      renderErrorUI(priorityOverride, code, wasTimeout, url, null);
      return;
    }

    if (code === 1) {
      renderErrorUI('aborted', code, wasTimeout, url, null);
      return;
    }

    if (code === 3) {
      renderErrorUI('nodecode', code, wasTimeout, url, null);
      return;
    }

    showImageThenDecide(url, code, wasTimeout);
  }

  function hideOverlay() {
    overlay.hidden = true;
    imgLoadingOverlay.hidden = true;
  }

  /* =========================================================
     ⑬ 加载动画控制
     ========================================================= */
  function showLoading() {
    loadingBox.classList.add('show');
  }
  function hideLoading() {
    loadingBox.classList.remove('show');
  }



  /* =========================================================
     ⑮ 中央图标
     ========================================================= */
  function hidePlayIcon() {
    clearTimeout(pauseIconTimer);
    playIcon.classList.remove('persist');
  }
  /* 暂停时显示中央图标（播放三角） */
  function showPauseIcon() {
    void playIcon.offsetWidth;
    playIcon.classList.add('persist');
    playIcon.classList.remove('show-pause');
  }

  /* =========================================================
     ⑯ 进度条
     ========================================================= */
  function updateProgress() {
    const d = video.duration;
    if (!d || !isFinite(d) || d <= 0) {
      progressPlayed.style.width = '0%';
      progressThumb.style.left = '0%';
      timeCurrent.textContent = '00:00';
      timeTotal.textContent = '00:00';
      return;
    }
    const ratio = dragging ? dragRatio : Math.max(0, Math.min(1, video.currentTime / d));
    const pct = (ratio * 100).toFixed(3) + '%';
    progressPlayed.style.width = pct;
    progressThumb.style.left = pct;
    timeCurrent.textContent = fmtTime(ratio * d);
    timeTotal.textContent = fmtTime(d);
  }

  function updateBuffer() {
    const d = video.duration;
    if (!d || !isFinite(d) || d <= 0 || !video.buffered.length) {
      progressBuffer.style.width = '0%';
      return;
    }
    let end = 0;
    try { end = video.buffered.end(video.buffered.length - 1); } catch (e) { end = 0; }
    const ratio = Math.max(0, Math.min(1, end / d));
    progressBuffer.style.width = (ratio * 100).toFixed(3) + '%';
  }

  function ratioFromEvent(e) {
    const rect = progressBar.getBoundingClientRect();
    if (rect.width <= 0) return 0;
    return Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
  }

  function seekTo(ratio) {
    const d = video.duration;
    if (!d || !isFinite(d) || d <= 0) return;
    dragRatio = ratio;
    try { video.currentTime = ratio * d; } catch (e) {}
    updateProgress();
  }

  progressBar.addEventListener('pointerdown', e => {
    if (!video.duration || !isFinite(video.duration)) return;
    e.preventDefault();
    dragging = true;
    progressBar.classList.add('dragging');
    try { progressBar.setPointerCapture(e.pointerId); } catch (err) {}
    showBar();
    clearTimeout(barTimer);
    seekTo(ratioFromEvent(e));
  });
  progressBar.addEventListener('pointermove', e => {
    if (!dragging) return;
    seekTo(ratioFromEvent(e));
  });
  function endDrag(e) {
    if (!dragging) return;
    dragging = false;
    progressBar.classList.remove('dragging');
    try { progressBar.releasePointerCapture(e.pointerId); } catch (err) {}
    scheduleHide(HIDE_DELAY);
  }
  progressBar.addEventListener('pointerup', endDrag);
  progressBar.addEventListener('pointercancel', endDrag);
  progressBar.addEventListener('click', e => e.stopPropagation());

  video.addEventListener('timeupdate', updateProgress);
  video.addEventListener('progress', updateBuffer);
  video.addEventListener('loadedmetadata', () => { updateProgress(); updateBuffer(); });
  video.addEventListener('durationchange', () => { updateProgress(); updateBuffer(); });
  video.addEventListener('seeked', updateProgress);

  /* =========================================================
     ⑰ 播放速度
     ========================================================= */
  function setRate(rate, silent) {
    rate = Number(rate);
    if (!isFinite(rate) || rate <= 0) rate = 1;
    currentRate = rate;
    video.playbackRate = rate;

    btnSpeed.textContent = (rate === 1 ? '1.0x' : rate + 'x');
    btnSpeed.classList.toggle('active', rate !== 1 || speedPanelOpen);

    Array.from(speedMenu.children).forEach(b => {
      const r = Number(b.dataset.rate);
      b.classList.toggle('active', Math.abs(r - rate) < 0.001);
    });

    if (!silent && rate !== 1) toast('播放速度 ' + btnSpeed.textContent);
  }

  speedMenu.addEventListener('click', e => {
    const b = e.target.closest('button[data-rate]');
    if (!b) return;
    e.stopPropagation();
    setRate(b.dataset.rate);
    setSpeedPanel(false);
  });

  function setSpeedPanel(open) {
    speedPanelOpen = open;
    speedBox.classList.toggle('open', open);
    btnSpeed.classList.toggle('active', open || currentRate !== 1);
    if (open) { showBar(); clearTimeout(barTimer); }
    else { scheduleHide(400); }
  }

  btnSpeed.addEventListener('click', e => {
    e.stopPropagation();
    setVolPanel(false);
    setSpeedPanel(!speedPanelOpen);
  });

  /* =========================================================
     ⑱ 音量
     ========================================================= */
  function paintVolume() {
    const v = video.muted ? 0 : video.volume;
    const pct = Math.round(v * 100);
    volRange.value = pct;
    volRange.style.setProperty('--v', pct + '%');

    if (v <= 0.001)      btnMute.innerHTML = SVG.mute;
    else if (v < 0.5)    btnMute.innerHTML = SVG.volLow;
    else                 btnMute.innerHTML = SVG.volHigh;

    btnMute.title = v <= 0.001 ? '取消静音' : '静音';
  }

  function applyVolume(v, fromUser) {
    v = Math.max(0, Math.min(1, v));
    video.muted = v <= 0.001;
    try { video.volume = v; } catch (e) {}
    if (fromUser && !volWarned && v > 0.001) {
      if (Math.abs(video.volume - v) > 0.05) {
        volWarned = true;
        toast('当前设备不支持网页调节音量，请用设备音量键');
      }
    }
    paintVolume();
  }

  function setVolPanel(open) {
    volPanelOpen = open;
    volBox.classList.toggle('open', open);
    if (open) { showBar(); clearTimeout(barTimer); }
    else { scheduleHide(400); }
  }

  volRange.addEventListener('input', () => {
    applyVolume(Number(volRange.value) / 100, true);
  });

  btnMute.addEventListener('click', e => {
    e.stopPropagation();
    setSpeedPanel(false);
    if (isMobile) {
      setVolPanel(!volPanelOpen);
    } else {
      if (video.muted || video.volume <= 0.001) {
        applyVolume(video.volume > 0.001 ? video.volume : 0.6, false);
      } else {
        video.muted = true;
        paintVolume();
      }
      setVolPanel(true);
    }
  });

  document.addEventListener('click', e => {
    if (!volBox.contains(e.target)) setVolPanel(false);
    if (!speedBox.contains(e.target)) setSpeedPanel(false);
  });

  video.addEventListener('volumechange', paintVolume);

  /* =========================================================
     ⑲ 播放 / 暂停
     ========================================================= */
  function togglePlay() {
    /* 未选择视频时禁止播放，仅提示 */
    if (index < 0 || !(video.currentSrc || video.src)) {
      toast('请选择视频后播放');
      return;
    }
    if (video.paused) video.play().catch(() => {});
    else video.pause();
  }
  function updatePlayBtn() {
    btnPlay.innerHTML = video.paused ? SVG.play : SVG.pause;
  }

  video.addEventListener('play', () => {
    clearTimeout(pauseIconTimer);
    updatePlayBtn();
    hidePlayIcon();
    scheduleVideoTrackCheck();
  });

  video.addEventListener('pause', () => {
    updatePlayBtn();
    clearVideoTrackCheck();
    hideLoading();
    if (switching) return;
    if (noVideoTrackShown) return;

    clearTimeout(pauseIconTimer);
    pauseIconTimer = setTimeout(() => {
      if (video.paused && !switching && !noVideoTrackShown) {
        showPauseIcon();
      }
    }, 180);
  });

  video.addEventListener('ended', () => {
    updatePlayBtn();
    clearVideoTrackCheck();
    hideLoading();
    showPauseIcon();
  });

  video.addEventListener('seeked', () => {
    if (!video.paused) scheduleVideoTrackCheck();
  });

  /* =========================================================
     ⑳ 加载动画事件绑定
     ========================================================= */
  video.addEventListener('loadstart', showLoading);
  video.addEventListener('waiting',   showLoading);
  video.addEventListener('seeking',   showLoading);
  video.addEventListener('stalled',   showLoading);

  video.addEventListener('loadeddata', hideLoading);
  video.addEventListener('canplay',    hideLoading);
  video.addEventListener('playing',    hideLoading);
  video.addEventListener('seeked',     hideLoading);
  video.addEventListener('error',      hideLoading);
  video.addEventListener('abort',      hideLoading);

  /* =========================================================
     ㉑ 舞台点击
        移动端：单击 → 切换功能栏显示/隐藏；显示后 7 秒自动隐藏
        桌面端：单击 → 切换工具栏显示 / 隐藏
        双击（两端）：暂停 / 播放
     ========================================================= */
  stage.addEventListener('click', e => {
    if (e.target !== video) return;

    const now = Date.now();
    const isDoubleTap = (now - lastTapTime) < DOUBLE_TAP_DELAY;

    if (isDoubleTap) {
      clearTimeout(tapTimer);
      lastTapTime = 0;
      togglePlay();
    } else {
      lastTapTime = now;
      clearTimeout(tapTimer);
      tapTimer = setTimeout(() => {
        tapTimer = 0;
        lastTapTime = 0;

        if (isMobile) {
          /* 移动端：单击切换功能栏显示/隐藏；显示后 7 秒自动隐藏 */
          if (bar.classList.contains('show')) {
            clearTimeout(barTimer);
            bar.classList.remove('show');
          } else {
            showBar();
            scheduleHide(MOBILE_HIDE_DELAY);
          }
        } else {
          /* 桌面端：单击切换工具栏显示 / 隐藏 */
          if (bar.classList.contains('show')) {
            clearTimeout(barTimer);
            bar.classList.remove('show');
          } else {
            showBar();
            scheduleHide(HIDE_DELAY);
          }
        }
      }, DOUBLE_TAP_DELAY);
    }
  });

  btnPlay.addEventListener('click', () => {
    togglePlay();
    showBar();
    scheduleHide(HIDE_DELAY);
  });

  /* =========================================================
     ㉒ 列表
     ========================================================= */
  function renderList() {
    listEl.innerHTML = '';
    if (!playlist.length) {
      listEl.appendChild(el('li', 'empty', '没有视频可播放'));
      return;
    }
    playlist.forEach((item, i) => {
      const li = el('li', 'item' + (i === index ? ' active' : ''));
      li.dataset.i = i;
      li.appendChild(el('span', 'idx', String(i + 1)));
      const meta = el('div', 'meta');
      meta.appendChild(el('div', 'nm', item.name));
      li.appendChild(meta);
      listEl.appendChild(li);
    });
  }

  /* =========================================================
     ㉓ 加载视频
     ========================================================= */
  function loadOnly(i) {
    if (i < 0 || i >= playlist.length) return;
    index = i;
    const item = playlist[i];
    lastUrl = item.url;

    renderList();
    nowTitle.textContent = item.name;
    document.title = item.name + ' · 播放器';

    hideOverlay();
    hidePlayIcon();
    clearTimeout(watchdog);
    clearTimeout(pauseIconTimer);
    clearVideoTrackCheck();
    timedOut = false;
    noVideoTrackShown = false;

    showLoading();

    switching = true;
    video.pause();
    video.removeAttribute('src');
    video.load();
    switching = false;

    progressPlayed.style.width = '0%';
    progressBuffer.style.width = '0%';
    progressThumb.style.left = '0%';
    timeCurrent.textContent = '00:00';
    timeTotal.textContent = '00:00';

    video.src = item.url;
    try { video.playbackRate = currentRate; } catch (e) {}
    video.load();

    try { video.pause(); } catch (e) {}

    updatePlayBtn();

    const onMeta = () => {
      video.removeEventListener('loadedmetadata', onMeta);
      if (!video.paused) {
        try { video.pause(); } catch (e) {}
      }
      updateProgress();
      updateBuffer();
      setTimeout(() => {
        if (video.paused && !noVideoTrackShown) showPauseIcon();
      }, 60);
    };
    video.addEventListener('loadedmetadata', onMeta);

    watchdog = setTimeout(() => {
      if (video.readyState < 1) {
        timedOut = true;
        showVideoError();
      }
    }, 60000);
  }

  /* =========================================================
     ㉔ 事件：加载相关
     ========================================================= */
  video.addEventListener('loadedmetadata', () => {
    clearTimeout(watchdog);
    updateProgress();
    updateBuffer();
  });
  video.addEventListener('loadeddata', () => clearTimeout(watchdog));
  video.addEventListener('canplay',    () => clearTimeout(watchdog));
  video.addEventListener('playing',    () => clearTimeout(watchdog));
  video.addEventListener('suspend',    () => {
    if (video.readyState >= 1) clearTimeout(watchdog);
  });
  video.addEventListener('progress',   () => {
    if (video.readyState >= 1 || video.buffered.length > 0) clearTimeout(watchdog);
  });

  video.addEventListener('error', () => {
    clearTimeout(watchdog);
    clearVideoTrackCheck();
    hidePlayIcon();
    if (!(video.currentSrc || video.src)) return;
    showVideoError();
  });

  video.addEventListener('ended', () => {
    if (index + 1 < playlist.length) loadOnly(index + 1);
  });

  /* =========================================================
     ㉕ 抽屉
     ========================================================= */
  function setPanel(open) {
    panel.classList.toggle('open', open);
    scrim.classList.toggle('show', open);
    if (open) { showBar(); hideOverlay(); }
    else { scheduleHide(400); }
  }
  $('btnList').addEventListener('click', () => setPanel(!panel.classList.contains('open')));
  $('btnClose').addEventListener('click', () => setPanel(false));
  scrim.addEventListener('click', () => setPanel(false));

  $('btnContact').addEventListener('click', () => {
    window.open(CONTACT_URL, '_blank', 'noopener');
  });

  $('btnDisableMusic').addEventListener('click', event => {
    pauseParentBackgroundMusic();
    event.currentTarget.textContent = '背景音乐已关闭';
    event.currentTarget.disabled = true;
  });

  /* =========================================================
     ㉖ 工具栏
     ========================================================= */
  function showBar() {
    clearTimeout(barTimer);
    bar.classList.add('show');
  }
  function scheduleHide(delay) {
    clearTimeout(barTimer);
    if (panel.classList.contains('open')) return;
    if (volPanelOpen || speedPanelOpen) return;
    if (dragging) return;
    /* 移动端统一使用 7 秒延迟；桌面端使用传入的延迟 */
    const actualDelay = isMobile ? MOBILE_HIDE_DELAY : delay;
    barTimer = setTimeout(() => bar.classList.remove('show'), actualDelay);
  }

  /* 判断鼠标是否靠近底部功能栏（在栏上或距底部 HOT_ZONE 内）——仅桌面端 */
  function isNearBar(e) {
    if (!e) return false;
    if (e.target && bar.contains(e.target)) return true;
    const rect = bar.getBoundingClientRect();
    if (rect.height <= 0) return false;
    return e.clientY >= rect.top - 40;
  }

  /* 桌面端：鼠标移动显示功能栏，停止 0.7 秒后隐藏；靠近功能栏时不隐藏 */
  stage.addEventListener('mousemove', e => {
    if (isMobile) return;
    showBar();
    if (isNearBar(e)) {
      clearTimeout(barTimer);
    } else {
      scheduleHide(HIDE_DELAY);
    }
  }, { passive: true });

  /* 桌面端鼠标进入功能栏：保持显示；离开后重新计时 */
  bar.addEventListener('mouseenter', () => {
    if (isMobile) return;
    clearTimeout(barTimer);
  });
  bar.addEventListener('mouseleave', () => {
    if (isMobile) return;
    scheduleHide(HIDE_DELAY);
  });

  /* 移动端：点击功能栏任意位置重新计时 */
  bar.addEventListener('click', () => {
    if (!isMobile) return;
    scheduleHide(MOBILE_HIDE_DELAY);
  });

  /* =========================================================
     ㉗ 全屏
     ========================================================= */
  function getFsEl() {
    return document.fullscreenElement || document.webkitFullscreenElement || null;
  }
  async function toggleFull() {
    try {
      if (!getFsEl()) {
        if (stage.requestFullscreen) await stage.requestFullscreen();
        else if (stage.webkitRequestFullscreen) stage.webkitRequestFullscreen();
        else if (video.webkitEnterFullscreen) video.webkitEnterFullscreen();
      } else {
        if (document.exitFullscreen) await document.exitFullscreen();
        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
      }
    } catch (e) {
      toast('无法进入全屏，请用视频自带的按钮');
    }
  }
  btnFull.addEventListener('click', toggleFull);

  ['fullscreenchange', 'webkitfullscreenchange'].forEach(ev =>
    document.addEventListener(ev, () => {
      const on = !!getFsEl();
      btnFull.innerHTML = on ? SVG.fsExit : SVG.fsEnter;
      btnFull.title = on ? '退出全屏 (F)' : '全屏 (F)';
      document.body.classList.toggle('in-fullscreen', on);

      showBar();
      scheduleHide(HIDE_DELAY);
    })
  );

  /* =========================================================
     ㉘ 上一个 / 下一个 / 列表点击
     ========================================================= */
  $('btnPrev').addEventListener('click', () => {
    if (index > 0) loadOnly(index - 1); else toast('已经是第一个了');
  });
  $('btnNext').addEventListener('click', () => {
    if (index < playlist.length - 1) loadOnly(index + 1); else toast('已经是最后一个了');
  });
  listEl.addEventListener('click', e => {
    const item = e.target.closest('.item');
    if (!item) return;
    loadOnly(Number(item.dataset.i));
    if (isMobile) setPanel(false);
  });

  /* =========================================================
     ㉙ 快捷键
     ========================================================= */
  document.addEventListener('keydown', e => {
    const tag = (e.target.tagName || '').toLowerCase();
    if (tag === 'textarea' || tag === 'input') return;

    if (e.code === 'Space') {
      e.preventDefault();
      togglePlay();
      showBar();
      scheduleHide(HIDE_DELAY);
    } else if (e.key === 'f' || e.key === 'F') {
      e.preventDefault();
      toggleFull();
    } else if (e.key === 'ArrowLeft') {
      e.preventDefault();
      if (video.duration && isFinite(video.duration)) {
        video.currentTime = Math.max(0, video.currentTime - 5);
        showBar();
        scheduleHide(HIDE_DELAY);
      }
    } else if (e.key === 'ArrowRight') {
      e.preventDefault();
      if (video.duration && isFinite(video.duration)) {
        video.currentTime = Math.min(video.duration, video.currentTime + 5);
        showBar();
        scheduleHide(HIDE_DELAY);
      }
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      applyVolume((video.muted ? 0 : video.volume) + 0.05, true);
      showBar();
      setVolPanel(true);
    } else if (e.key === 'ArrowDown') {
      e.preventDefault();
      applyVolume((video.muted ? 0 : video.volume) - 0.05, true);
      showBar();
      setVolPanel(true);
    } else if (e.key === 'm' || e.key === 'M') {
      e.preventDefault();
      if (video.muted || video.volume <= 0.001) applyVolume(video.volume > 0.001 ? video.volume : 0.6, false);
      else { video.muted = true; paintVolume(); }
      showBar();
      setVolPanel(true);
    } else if (e.key === 'j' || e.key === 'J') {
      if (video.duration && isFinite(video.duration)) {
        video.currentTime = Math.max(0, video.currentTime - 10);
        showBar();
        scheduleHide(HIDE_DELAY);
      }
    } else if (e.key === 'l' || e.key === 'L') {
      if (video.duration && isFinite(video.duration)) {
        video.currentTime = Math.min(video.duration, video.currentTime + 10);
        showBar();
        scheduleHide(HIDE_DELAY);
      }
    }
  });

  /* =========================================================
     ㉚ 启动
     ========================================================= */
  renderList();
  updatePlayBtn();
  paintVolume();
  setRate(1, true);
  btnFull.innerHTML = SVG.fsEnter;

  if (playlist.length) {
    nowTitle.textContent = '请选择视频';
    setPanel(true);
  } else {
    overlay.hidden = false;
    ovIcon.textContent = '🎬';
    ovTitle.textContent = '没有视频';
    ovReason.textContent = '请在 HTML 源码顶部的 VIDEO_LIST 数组中添加新视频链接。';
    ovScenarios.innerHTML = '';
    ovDetail.hidden = true;
    ovBtns.innerHTML = '';
    ovBtns.appendChild(mkBtn('打开视频列表', 'primary', () => setPanel(true)));
  }

  setTimeout(() => {
    showBar();
    scheduleHide(2600);
  }, 400);
})();
</script>
</body>
</html>
