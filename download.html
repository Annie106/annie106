    function getSearchKeyword() {
        const input = document.getElementById('searchInput');
        return input ? input.value.trim().toLowerCase() : '';
    }

    const downloadIconSvg = `
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
            <g stroke-width="0" id="SVGRepo_bgCarrier"></g>
            <g stroke-linejoin="round" stroke-linecap="round" id="SVGRepo_tracerCarrier"></g>
            <g id="SVGRepo_iconCarrier">
                <g id="Interface / Download">
                    <path stroke-linejoin="round" stroke-linecap="round" stroke-width="2" stroke="#f1f1f1"
                          d="M6 21H18M12 3V17M12 17L17 12M12 17L7 12"></path>
                </g>
            </g>
        </svg>
    `;

    function renderCards(activeCategory = "全部", searchKeyword = '') {
        const container = document.getElementById('downloadsContainer');
        if (!container) return;

        const keyword = searchKeyword.trim().toLowerCase();
        let html = '';
        for (let category of categories) {
            if (category !== '全部' && (activeCategory === '全部' || activeCategory === category)) {
                const items = downloadsData.filter(item => {
                    if (item.category !== category) return false;
                    if (!keyword) return true;
                    const fullText = `${item.name} ${item.version} ${item.shortDesc} ${item.fullDesc} ${item.features.join(' ')}`.toLowerCase();
                    return fullText.includes(keyword);
                });
                if (!items.length) continue;

                html += `<div class="download-section">
                    <div class="section-title">${category}</div>
                    <div class="download-grid">
                        ${items.map(item => {
                            const featuresHtml = item.features.map(feat => `<i>✨ ${feat}</i>`).join('');
                            return `
                                <div class="download-card" data-id="${item.id}">
                                    <div class="card-header">
                                        <div class="app-icon">${item.icon}</div>
                                        <div class="app-title">
                                            ${item.name}
                                            <span class="version-badge">v${item.version}</span>
                                        </div>
                                        <div class="meta-info">
                                            <span>📅 ${item.date}</span>
                                            <span>⬇️ ${item.downloadsCount}</span>
                                            <span>📄 ${item.size}</span>
                                        </div>
                                    </div>
                                    <div class="description">
                                        <p style="font-weight: 600; margin-bottom: 6px;">📌 ${item.shortDesc}</p>
                                        <p style="font-size: 0.88rem; margin-bottom: 8px;">${item.fullDesc}</p>
                                        ${item.extraNote ? `<p style="font-size: 0.82rem; color: #64748b; margin-bottom: 8px;">${item.extraNote}</p>` : ''}
                                        <div class="detail-feature">
                                            ${featuresHtml}
                                        </div>
                                    </div>
                                    <div class="card-footer">
                                        <div class="file-size">💾 包体大小: ${item.size}</div>
                                        <button class="download-btn" data-id="${item.id}" type="button" aria-label="下载 ${item.name}">
                                            ${downloadIconSvg}
                                            <span>Download</span>
                                            <span class="btn-tooltip">点击下载 ${item.name}</span>
                                        </button>
                                    </div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>`;
            }
        }

        if (!html) {
            html = `<div class="empty-state">未找到匹配内容，请尝试更换关键词或切换分类。</div>`;
        }
        container.innerHTML = html;
    }

    function renderCategoryNav() {
        const nav = document.getElementById('categoryNav');
        if (!nav) return;

        nav.innerHTML = categories.map(category => `
            <button class="category-button${category === '全部' ? ' active' : ''}" data-category="${category}">${category}</button>
        `).join('');

        nav.addEventListener('click', (e) => {
            const btn = e.target.closest('.category-button');
            if (!btn) return;
            const selected = btn.getAttribute('data-category');
            currentCategory = selected;
            document.querySelectorAll('.category-button').forEach(button => {
                button.classList.toggle('active', button.getAttribute('data-category') === selected);
            });
            renderCards(selected, getSearchKeyword());
        });
    }

    function bindSearch() {
        const input = document.getElementById('searchInput');
        const button = document.getElementById('searchButton');
        if (!input || !button) return;

        input.addEventListener('input', () => {
            renderCards(currentCategory, getSearchKeyword());
        });
        button.addEventListener('click', () => {
            renderCards(currentCategory, getSearchKeyword());
            input.focus();
        });
    }

    function bindDownloadEvents() {
        const container = document.getElementById('downloadsContainer');
        if (!container) return;

        container.addEventListener('click', (e) => {
            const btn = e.target.closest('.download-btn');
            if (!btn) return;
            const cardId = parseInt(btn.getAttribute('data-id'));
            const targetItem = downloadsData.find(item => item.id === cardId);
            if (targetItem && targetItem.realUrlReversed) {
                const realUrl = reverseStr(targetItem.realUrlReversed);
                if (realUrl && (realUrl.startsWith('http://') || realUrl.startsWith('https://'))) {
                    showToast('正在准备下载...');
                    setTimeout(() => {
                        window.location.href = realUrl;
                    }, 80);
                } else {
                    console.error('无效链接', realUrl);
                    showToast('链接解析异常，请联系 RH 工作室 ', true);
                }
            } else {
                showToast('下载地址暂时不可用', true);
            }
        });
    }

    let toastTimeout = null;
    function showToast(msg, isError = false) {
        const toastEl = document.getElementById('toast');
        if (!toastEl) return;
        if (toastTimeout) clearTimeout(toastTimeout);
        toastEl.style.opacity = '1';
        toastEl.style.background = isError ? '#b91c1cdd' : '#0f172add';
        toastEl.innerText = msg || (isError ? '出错了' : '🚀 正在跳转下载链接...');
        toastTimeout = setTimeout(() => {
            toastEl.style.opacity = '0';
        }, 1800);
    }

    function validateLinks() {
        for (let item of downloadsData) {
            const reversed = item.realUrlReversed;
            if (reversed && typeof reversed === 'string') {
                const originUrl = reverseStr(reversed);
                if (!originUrl.startsWith('https://') && !originUrl.startsWith('http://')) {
                    console.warn(`项目 ${item.name} 链接格式异常，请检查原始数据`);
                }
            } else {
                console.error(`项目 ${item.name} 缺少反转链接字段`);
            }
        }
    }

    renderCategoryNav();
    bindSearch();
    renderCards(currentCategory, getSearchKeyword());
    bindDownloadEvents();
    validateLinks();
</script>
</body>
</html>
